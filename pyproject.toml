[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-sandbox-backend"
version = "0.2.1"
description = "Hermes terminal provider using the official Agent Sandbox router"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = ["kubernetes==35.0.0", "k8s-agent-sandbox==1.0.9"]

[project.entry-points."hermes_agent.plugins"]
agent_sandbox = "hermes_agent_sandbox"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.4", "mypy==1.18.2", "build==1.3.0", "PyYAML==6.0.3", "python-dotenv==1.2.1", "rich==14.2.0", "ruamel.yaml==0.18.16", "psutil==7.1.3", "fastapi==0.121.0", "uvicorn==0.38.0", "python-multipart==0.0.20", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_agent_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cluster: read-only tests against a prepared cluster", "docker: opt-in test of the built runner image"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/runner", "/tests", "/docs", "/examples", "/.github",
  "/README.md", "/CHANGELOG.md", "/LICENSE", "/plugin.yaml",
  "/__init__.py", "/pyproject.toml", "/uv.lock", "/.dockerignore"
]
